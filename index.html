<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script type="text/javascript" src="darkmode.js" defer></script>
    <title>Mi Calc</title>
</head>
    <body>
        <div class="topLabel">
            <button id="trocar-tema">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M352.54-352.54Q300-405.08 300-480q0-74.92 52.54-127.46Q405.08-660 480-660q74.92 0 127.46 52.54Q660-554.92 660-480q0 74.92-52.54 127.46Q554.92-300 480-300q-74.92 0-127.46-52.54ZM200-450H50v-60h150v60Zm710 0H760v-60h150v60ZM450-760v-150h60v150h-60Zm0 710v-150h60v150h-60ZM262.92-656.92l-93.69-90.46 42.39-44.39 90.23 92.69-38.93 42.16Zm485.46 488.69-90.84-93.31 39.54-41.54 93.69 90.46-42.39 44.39Zm-91.46-528.85 90.46-93.69 44.39 42.39-92.69 90.23-42.16-38.93ZM168.23-211.62l93.31-90.84 40.77 39.54-90.08 94.07-44-42.77Z"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M481.15-140q-141.66 0-240.83-99.17-99.16-99.16-99.16-240.83 0-135.77 92.11-232.88 92.11-97.12 225.57-105.2 8.62 0 16.93.62 8.3.62 16.3 1.85-30.61 28.61-48.76 69.15-18.16 40.54-18.16 86.46 0 98.33 68.84 167.17Q562.82-424 661.15-424q46.54 0 86.77-18.15 40.23-18.16 68.46-48.77 1.23 8 1.85 16.31.61 8.3.61 16.92-7.69 133.46-104.8 225.57Q616.92-140 481.15-140Z"/></svg>
            </button>
        </div>
        <div class="fundo">
            <p>by InasAlmeida</p>
            <div class="calculadora">
                <div class="cabecalho">
                    <span class="material-symbols-outlined" id="resize">open_in_full</span>
                    <h2>Calculator</h2>
                    <h2>Converter</h2>
                    <span class="material-symbols-outlined">more_vert</span>
                </div>
                <div id="visor">
                    <p id ="historico"></p>
                    <p id="telinha"></p>
                </div>

                <table>
                    <tr>
                        <td><button class="botao operador" onclick="clean()">C</button></td>
                        <td><button class="botao operador" onclick="backspace()"><span class="material-symbols-outlined">backspace</span></button></td>
                        <td><button class="botao operador" onclick="insert('%')">%</button></td>
                        <td><button class="botao operador" onclick="insert('÷')">÷</button></td>
                    </tr>
                    <tr>
                        <td><button class="botao numero" onclick="insert('7')">7</button></td>
                        <td><button class="botao numero" onclick="insert('8')">8</button></td>
                        <td><button class="botao numero" onclick="insert('9')">9</button></td>
                        <td><button class="botao operador" onclick="insert('x')">x</button></td>
                    </tr>
                    <tr>
                        <td><button class="botao numero" onclick="insert('4')">4</button></td>
                        <td><button class="botao numero" onclick="insert('5')">5</button></td>
                        <td><button class="botao numero" onclick="insert('6')">6</button></td>
                        <td><button class="botao operador" onclick="insert('-')">-</button></td>
                    </tr>
                    <tr>
                        <td><button class="botao numero" onclick="insert('1')">1</button></td>
                        <td><button class="botao numero" onclick="insert('2')">2</button></td>
                        <td><button class="botao numero" onclick="insert('3')">3</button></td>
                        <td><button class="botao operador" onclick="insert('+')">+</button></td>
                    </tr>
                    <tr>
                        <td><button class="botao operador" id="sci"></button></td>
                        <td><button class="botao numero" onclick="insert('0')">0</button></td>
                        <td><button class="botao numero" onclick="insert(',')">,</button></td>
                        <td><button class="botao operador" onclick="calcular()">=</button></td>
                        
                    </tr>
                </table>
            </div>
        </div>

    <script src="script.js"></script>
    </body>
</html>
